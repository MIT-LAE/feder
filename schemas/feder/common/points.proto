message Points {
    // Timestamps: POSIX timestamps (integer seconds).
    repeated uint64 time = 1 [packed = true];

    // Longitude: WGS-84 decimal degrees.
    repeated float lon = 2 [packed = true];

    // Latitude: WGS-84 decimal degrees.
    repeated float lat = 3 [packed = true];

    // For the alt, alt_gnss and heading fields, any value less than zero
    // represents missing data.

    // Barometric altitude: meters relative to MSL.
    repeated float alt = 4 [packed = true];

    // GNSS altitude: meters relative to WGS-84.
    repeated float alt_gnss = 5 [packed = true];

    // Heading: degrees clockwise from North.
    repeated float heading = 6 [packed = true];

    // Air/ground flag.
    repeated bool on_ground = 7 [packed = true];
}
