[project]
name = "feder-server"
version = "1.2.1"
description = "Library for shared server-side code in Feder"
readme = "README.md"
authors = [
    { name = "Ian Ross", email = "iross@mit.edu" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=2.2.3",
    "pika>=1.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feder_server"]
