[project]
name = "state-of-feder"
version = "1.0.0"
description = "Feder status email sender"
readme = "README.md"
authors = [
    { name = "Ian Ross", email = "iross@mit.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "mailjet-rest>=1.4.0",
]

[project.scripts]
state-of-feder = "state_of_feder:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/state_of_feder"]
