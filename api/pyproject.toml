[project]
name = "feder"
version = "1.0.0"
description = "Feder flight data system client API"
readme = "README.md"
authors = [
    { name = "Ian Ross", email = "iross@mit.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "lz4>=4.4.5",
    "numpy>=1.24"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feder"]
