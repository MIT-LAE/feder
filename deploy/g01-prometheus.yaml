global:
  scrape_interval: 60s
  external_labels:
    project_id: mcast01
    location: us-east1

scrape_configs:
  - job_name: "feder-ingest"
    static_configs:
      - targets: ["g01:19001"]
  - job_name: "feder-rx-contrails-api"
    static_configs:
      - targets: ["g01:19002"]
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["g01:15692"]
  - job_name: "hex-g01-prometheus"
    static_configs:
      - targets: ["localhost:9090"]
