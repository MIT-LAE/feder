[project]
name = "feder-root"
version = "0.1.1"
description = "LAE flight data collection and access system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "bump-my-version>=1.1.1",
    "hypothesis>=6.131.3",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.1",
    "pdoc>=15.0.3",
    "pyright>=1.1.397",
    "pytest>=8.3.5",
    "python-lsp-server[all]>=1.12.2",
    "ruff>=0.11.2",
]

[tool.uv.workspace]
members = ["libs/*", "apps/*", "api"]

[tool.bumpversion]
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []

[[tool.bumpversion.files]]
filename = "libs/common/src/feder_common/__init__.py"
